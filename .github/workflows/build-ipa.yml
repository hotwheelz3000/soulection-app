name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The app name comes from `product:` in xtool.yml, so the IPA and the
      # artifact follow the app automatically after ./rename-app.sh.
      - name: Read app name
        id: app
        run: |
          name=$(awk -F': *' '$1 == "product" { print $2 }' xtool.yml | tr -d "\"' \r")
          if [ -z "$name" ]; then
            echo "::error::xtool.yml has no 'product:' entry"
            exit 1
          fi
          echo "App name: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Per https://xtool.sh/documentation/xtooldocs/installation-macos:
      # use the preinstalled Xcode for the iOS SDK + Swift toolchain, then
      # install xtool via Homebrew. No `xtool setup` / Apple ID is needed for
      # an unsigned build.
      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          xcrun -sdk iphoneos -show-sdk-path
          swift --version

      # iconPath in xtool.yml points at Resources/AppIcon.png. If it isn't
      # committed yet, download the site's largest icon, make it a 1024x1024
      # opaque PNG, and commit it back so later builds don't need the network.
      - name: Fetch app icon if missing
        id: icon
        run: |
          if [ -f Resources/AppIcon.png ]; then
            echo "Resources/AppIcon.png already present"
            exit 0
          fi
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install --quiet pillow
          mkdir -p Resources
          .icon-venv/bin/python scripts/fetch-app-icon.py https://radio.soulection.com/ Resources/AppIcon.png
          sips -g pixelWidth -g pixelHeight -g hasAlpha Resources/AppIcon.png
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - name: Commit fetched icon
        if: steps.icon.outputs.fetched == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add Resources/AppIcon.png
          git commit -m "Add app icon fetched from radio.soulection.com"
          git push origin HEAD:main || echo "::warning::Could not push the fetched icon"

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --help
          xtool dev build --help

      # Stamp the build's date and time into the app (shown at the bottom of the help
      # window), so testers can say which build they have.
      - name: Stamp build info
        run: |
          label=$(TZ=America/Los_Angeles date '+%b %-d, %Y %-I:%M %p')
          cat > Sources/SoulectionRadio/BuildInfo.swift <<EOF
          /// Written by the Build IPA workflow.
          enum BuildInfo {
              static let label = "$label"
          }
          EOF
          cat Sources/SoulectionRadio/BuildInfo.swift

      # Builds for arm64-apple-ios (the default triple). Without --sign the
      # app is left unsigned; --ipa zips it into Payload/ as xtool/<App>.ipa.
      # Compiler errors are also reported as annotations, so they show up on the
      # run's summary page without opening the full log.
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          if ! xtool dev build --ipa 2>&1 | tee build.log; then
            grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Package IPA manually if needed
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          if [ ! -f "xtool/$APP_NAME.ipa" ]; then
            echo "xtool did not produce an .ipa; packaging the .app manually"
            rm -rf Payload
            mkdir Payload
            cp -R "xtool/$APP_NAME.app" Payload/
            zip -r "xtool/$APP_NAME.ipa" Payload
          fi
          ls -la xtool

      # Stamp the IPA with the build time as Los Angeles wall-clock time. Zip
      # files store a time with no time zone, and the artifact upload writes it
      # in UTC, which then shows 7-8 hours ahead on a phone in LA. Setting the
      # file's time to "LA time, labelled as UTC" cancels that out (daylight
      # saving is handled by the date command).
      # Also makes a copy named with the build time (SoulectionRadio-2026-10-26-1623.ipa),
      # so downloading a new build on an iPhone never collides with an older one
      # ("SoulectionRadio.ipa 2"). That copy is what the Actions download holds.
      - name: Stamp IPA with build time
        id: stamp
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          la_now=$(TZ=America/Los_Angeles date +%Y%m%d%H%M.%S)
          TZ=UTC touch -t "$la_now" "xtool/$APP_NAME.ipa"
          stamp=$(TZ=America/Los_Angeles date '+%Y-%m-%d-%H%M')
          cp -p "xtool/$APP_NAME.ipa" "xtool/$APP_NAME-$stamp.ipa"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "label=$(TZ=America/Los_Angeles date '+%b %-d, %Y %-I:%M %p')" >> "$GITHUB_OUTPUT"
          echo "Stamped with LA time $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app.outputs.name }}-${{ steps.stamp.outputs.stamp }}
          path: xtool/${{ steps.app.outputs.name }}-${{ steps.stamp.outputs.stamp }}.ipa
          if-no-files-found: error

      # Every build of main is also published as the "latest" GitHub Release, so testers
      # can download the IPA from a plain link (no GitHub login; artifacts need one).
      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ steps.app.outputs.name }}
          stamp: ${{ steps.stamp.outputs.stamp }}
          label: ${{ steps.stamp.outputs.label }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "xtool/$APP_NAME-$stamp.ipa" \
            --title "Latest build ($label)" \
            --notes "Built from ${GITHUB_SHA::7} on $label (Los Angeles time). Download $APP_NAME-$stamp.ipa below and install it with Sideloadly or AltStore; see the README for the steps." \
            --latest
