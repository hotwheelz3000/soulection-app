name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Skip Homebrew's slow self-update on every run.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history, to count the builds of this version

      # The app name comes from `product:` in xtool.yml, so the IPA and the
      # artifact are named after the app.
      - name: Read app name
        id: app
        run: |
          name=$(awk -F': *' '$1 == "product" { print $2 }' xtool.yml | tr -d "\"' \r")
          if [ -z "$name" ]; then
            echo "::error::xtool.yml has no 'product:' entry"
            exit 1
          fi
          echo "App name: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Per https://xtool.sh/documentation/xtooldocs/installation-macos:
      # use the preinstalled Xcode for the iOS SDK + Swift toolchain, then
      # install xtool via Homebrew. No `xtool setup` / Apple ID is needed for
      # an unsigned build.
      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          xcrun -sdk iphoneos -show-sdk-path
          swift --version

      # iconPath in xtool.yml points at Resources/AppIcon.png. If it isn't
      # committed yet, download the site's largest icon, make it a 1024x1024
      # opaque PNG, and commit it back so later builds don't need the network.
      - name: Fetch app icon if missing
        id: icon
        run: |
          if [ -f Resources/AppIcon.png ]; then
            echo "Resources/AppIcon.png already present"
            exit 0
          fi
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install --quiet pillow
          mkdir -p Resources
          .icon-venv/bin/python scripts/fetch-app-icon.py https://radio.soulection.com/ Resources/AppIcon.png
          sips -g pixelWidth -g pixelHeight -g hasAlpha Resources/AppIcon.png
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - name: Commit fetched icon
        if: steps.icon.outputs.fetched == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add Resources/AppIcon.png
          git commit -m "Add app icon fetched from radio.soulection.com"
          git push origin HEAD:main || echo "::warning::Could not push the fetched icon"

      # Caches: Homebrew downloads and SwiftPM's .build folder (packages + compiled
      # code), so later builds only recompile what changed. The Xcode version is in
      # the key, so a runner update starts a fresh cache.
      - name: Xcode version for cache
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/build-ipa.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ steps.xcode.outputs.version }}-

      # Lint before building. SwiftLint errors (force_try, force_cast) stop the run;
      # warnings and swift-format style notes show up as annotations on the run page.
      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --reporter github-actions-logging
          if swift format --version > /dev/null 2>&1; then
            swift format lint --recursive Sources 2>&1 | while IFS= read -r line; do
              echo "::notice::$line"
            done
          fi

      # Syntax-checks the JavaScript held in Swift multi-line strings (the scripts
      # injected into the web view), so a broken script stops the build here instead
      # of shipping. Errors point at the Swift file and line.
      - name: Check injected JavaScript
        run: python3 scripts/check-js.py Sources

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --help
          xtool dev build --help

      # Stamp the build's date and time into the app (shown at the bottom of the help
      # window), so testers can say which build they have.
      # The version comes from CFBundleShortVersionString in the Info.plist named by
      # infoPath in xtool.yml (shown in Help as "Version 1.0").
      - name: Stamp build info
        id: info
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          plist=$(awk -F': *' '$1 == "infoPath" { print $2 }' xtool.yml | tr -d "\"' \r")
          version=$(plutil -extract CFBundleShortVersionString raw "$plist" 2>/dev/null || echo "")
          # Build number: how many commits in a row (counting this one) have this version.
          # The first build of a new version is 1 and isn't shown; later ones are, so every
          # download has its own name (SoulectionRadio-5.0-3.ipa) and Help says "(build 3)".
          ver_at() { git show "$1:$plist" 2>/dev/null | awk '/CFBundleShortVersionString/{getline; gsub(/.*<string>|<\/string>.*/,""); print; exit}'; }
          build=0
          for c in $(git rev-list --first-parent HEAD); do
            [ "$(ver_at "$c")" = "$version" ] || break
            build=$((build + 1))
          done
          label="Version ${version:-unknown}"
          if [ -n "$version" ] && [ "$build" -gt 1 ]; then label="$label (build $build)"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          # The build number is also CFBundleVersion, so sideload sources see each build as an update.
          if [ -n "$plist" ] && [ "$build" -gt 0 ]; then plutil -replace CFBundleVersion -string "$build" "$plist"; fi
          cat > "Sources/$APP_NAME/BuildInfo.swift" <<EOF
          /// Written by the Build IPA workflow.
          enum BuildInfo {
              static let label = "$label"
          }
          EOF
          cat "Sources/$APP_NAME/BuildInfo.swift"

      # Builds for arm64-apple-ios (the default triple). Without --sign the
      # app is left unsigned; --ipa zips it into Payload/ as xtool/<App>.ipa.
      # Compiler errors are also reported as annotations, so they show up on the
      # run's summary page without opening the full log.
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          if ! xtool dev build --ipa 2>&1 | tee build.log; then
            grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Package IPA manually if needed
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          if [ ! -f "xtool/$APP_NAME.ipa" ]; then
            echo "xtool did not produce an .ipa; packaging the .app manually"
            rm -rf Payload
            mkdir Payload
            cp -R "xtool/$APP_NAME.app" Payload/
            zip -r "xtool/$APP_NAME.ipa" Payload
          fi
          ls -la xtool

      # Stamp the IPA with the build time as Los Angeles wall-clock time. Zip
      # files store a time with no time zone, and the artifact upload writes it
      # in UTC, which then shows 7-8 hours ahead on a phone in LA. Setting the
      # file's time to "LA time, labelled as UTC" cancels that out (daylight
      # saving is handled by the date command).
      # Also makes a copy named with the app's version, plus the build number after the first
      # build of a version (SoulectionRadio-5.0.ipa, then SoulectionRadio-5.0-2.ipa; the build
      # time if there's no version). That copy is what the release and Actions download hold.
      - name: Stamp IPA with build time
        id: stamp
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
          version: ${{ steps.info.outputs.version }}
          build: ${{ steps.info.outputs.build }}
        run: |
          la_now=$(TZ=America/Los_Angeles date +%Y%m%d%H%M.%S)
          TZ=UTC touch -t "$la_now" "xtool/$APP_NAME.ipa"
          stamp=$(TZ=America/Los_Angeles date '+%Y-%m-%d-%H%M')
          file="$APP_NAME-${version:-$stamp}"
          if [ -n "$version" ] && [ "${build:-0}" -gt 1 ]; then file="$file-$build"; fi
          cp -p "xtool/$APP_NAME.ipa" "xtool/$file.ipa"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "label=$(TZ=America/Los_Angeles date '+%b %-d, %Y %-I:%M %p')" >> "$GITHUB_OUTPUT"
          echo "Stamped with LA time $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stamp.outputs.file }}
          path: xtool/${{ steps.stamp.outputs.file }}.ipa
          if-no-files-found: error

      # An AltStore-format source (source.json) listing this build, for sideloading
      # apps that follow a source URL and show updates:
      #   https://github.com/<owner>/<repo>/releases/download/latest/source.json
      - name: Write source.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FILE_BASE: ${{ steps.stamp.outputs.file }}
          version: ${{ steps.info.outputs.version }}
          build: ${{ steps.info.outputs.build }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          plist=$(awk -F': *' '$1 == "infoPath" { print $2 }' xtool.yml | tr -d "\"' \r")
          product=$(awk -F': *' '$1 == "product" { print $2 }' xtool.yml | tr -d "\"' \r")
          bundle=$(awk -F': *' '$1 == "bundleID" { print $2 }' xtool.yml | tr -d "\"' \r")
          display=$(plutil -extract CFBundleDisplayName raw "$plist" 2>/dev/null || echo "$product")
          icon=""
          icon_path=$(awk -F': *' '$1 == "iconPath" { print $2 }' xtool.yml | tr -d "\"' \r")
          if [ -n "$icon_path" ] && [ -f "$icon_path" ]; then
            cp "$icon_path" xtool/AppIcon.png
            icon="$base/AppIcon.png"
          fi
          notes=""
          [ -f RELEASE_NOTES.md ] && notes=$(cat RELEASE_NOTES.md)
          size=$(stat -f%z "xtool/$FILE_BASE.ipa")
          APP_DISPLAY="$display" BUNDLE="$bundle" python3 - "$base/$FILE_BASE.ipa" "$size" "$icon" "$notes" > xtool/source.json <<'PY'
          import json, os, sys, datetime
          url, size, icon, notes = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
          repo = os.environ["GITHUB_REPOSITORY"]
          app = {
              "name": os.environ["APP_DISPLAY"],
              "bundleIdentifier": os.environ["BUNDLE"],
              "developerName": repo.split("/")[0],
              "localizedDescription": f"{os.environ['APP_DISPLAY']}, built from {repo}.",
              "versions": [{
                  "version": os.environ.get("version") or "1.0",
                  "buildVersion": os.environ.get("build") or "1",
                  "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "localizedDescription": notes,
                  "downloadURL": url,
                  "size": size,
              }],
          }
          if icon:
              app["iconURL"] = icon
          print(json.dumps({
              "name": os.environ["APP_DISPLAY"],
              "identifier": os.environ["BUNDLE"] + ".source",
              "apps": [app],
              "news": [],
          }, indent=2))
          PY
          cat xtool/source.json

      # Every build of main is also published as the "latest" GitHub Release, so testers
      # can download the IPA from a plain link (no GitHub login; artifacts need one).
      # The title carries the app's version ("Soulection Radio 1.0"); the notes come from
      # RELEASE_NOTES.md plus the build time. A release left as a draft (it happened once)
      # is published at the end, so the download link always works.
      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ steps.app.outputs.name }}
          file: ${{ steps.stamp.outputs.file }}
          label: ${{ steps.stamp.outputs.label }}
          version: ${{ steps.info.outputs.version }}
        run: |
          title="Soulection Radio${version:+ $version}"
          {
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; echo; fi
            echo "Built from ${GITHUB_SHA::7} on $label (Los Angeles time). Download $file.ipa below and install it with Sideloadly or AltStore; the README has the steps."
          } > release-notes.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "xtool/$file.ipa" xtool/source.json $( [ -f xtool/AppIcon.png ] && echo xtool/AppIcon.png ) \
            --title "$title" \
            --notes-file release-notes.txt \
            --latest
          gh release edit latest --draft=false
